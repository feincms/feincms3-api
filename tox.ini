[tox]
envlist =
    py{311,313}-dj{52}
    py{312,314}-dj{60}
    py{312,315}-dj{61}
    py{315}-dj{main}

[testenv]
usedevelop = true
extras = tests
commands =
    python -Wd {envbindir}/coverage run tests/manage.py test -v2 {posargs:testapp}
    coverage report -m
deps =
    dj52: Django>=5.2,<6.0
    dj60: Django>=6.0,<6.1
    dj61: Django>=6.1,<6.2
    djmain: https://github.com/django/django/archive/main.tar.gz
