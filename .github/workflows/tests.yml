name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Install uv
      uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
    - name: Run the tox environments for Python ${{ matrix.python-version }}
      run: |
        ENV_PREFIX=py$(tr -C -d "0-9" <<< "${{ matrix.python-version }}")
        uvx --with tox-uv tox -e "$(uvx tox --listenvs | grep "^$ENV_PREFIX-" | paste -sd,)"
