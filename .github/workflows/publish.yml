name: Publish to PyPI

# A tag `1.2.3` publishes feincms3-api, a tag `cli-1.2.3` feincms3-api-cli
# (from `cli/`). The tag has to match the package's version (0.1 = 0.1.0).

on:
  push:
    tags:
      - "*"

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    if: github.event.repository.fork == false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: 3.x
      - name: Build
        run: |
          python -m pip install --upgrade build
          if [[ "$GITHUB_REF_NAME" == cli-* ]]; then
            python -m build cli --outdir dist
            version="${GITHUB_REF_NAME#cli-}"
          else
            python -m build
            version="$GITHUB_REF_NAME"
          fi
          python - "$version" <<'EOF'
          import pathlib, sys
          from packaging.version import Version
          (sdist,) = pathlib.Path("dist").glob("*.tar.gz")
          built = sdist.name.removesuffix(".tar.gz").rpartition("-")[2]
          if Version(built) != Version(sys.argv[1]):
              sys.exit(f"The tag says {sys.argv[1]}, the package {built}")
          EOF
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
