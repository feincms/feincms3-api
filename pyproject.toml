[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling" ]

[project]
name = "feincms3-api"
description = "A content API for feincms3 sites"
readme = "README.md"
license = "BSD-3-Clause"
authors = [
  { name = "Feinheit AG", email = "dev@feinheit.ch" },
  { name = "Matthias Kestenholz", email = "mk@feinheit.ch" },
  { name = "Moritz Wettstein", email = "mw@feinheit.ch" },
]
requires-python = ">=3.11"
classifiers = [
  "Environment :: Web Environment",
  "Framework :: Django",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
]
dynamic = [ "version" ]
dependencies = [
  "django>=5.2",
  "django-content-editor>=10",
  "django-ninja>=1.4",
  "feincms3>=5",
  "feincms3-data>=0.11",
]
optional-dependencies.anthropic = [
  "anthropic>=0.70",
]
optional-dependencies.tests = [
  "coverage",
  "django-cabinet",
  "django-json-schema-editor",
  "django-prose-editor",
  "django-translated-fields",
  "feincms3-forms",
]
urls.Homepage = "https://github.com/feincms/feincms3-api/"

[tool.hatch]
version.path = "feincms3_api/__init__.py"
build.include = [ "feincms3_api/" ]

[tool.ruff]
target-version = "py311"
fix = true
show-fixes = true
lint.extend-select = [
  # flake8-bugbear
  "B",
  # flake8-comprehensions
  "C4",
  # mmcabe
  "C90",
  # flake8-django
  "DJ",
  "E",
  # pyflakes, pycodestyle
  "F",
  # flake8-boolean-trap
  "FBT",
  # isort
  "I",
  # flake8-gettext
  "INT",
  # pep8-naming
  "N",
  # pygrep-hooks
  "PGH",
  # flake8-pie
  "PIE",
  # pylint
  "PL",
  # unused noqa
  "RUF100",
  # flake8-simplify
  "SIM",
  # pyupgrade
  "UP",
  "W",
  # flake8-2020
  "YTT",
]
lint.extend-ignore = [
  # Allow zip() without strict=
  "B905",
  # No line length errors
  "E501",
  "RUF012",
]
lint.per-file-ignores."*/migrat*/*" = [
  # Allow using PascalCase model names in migrations
  "N806",
  # Ignore the fact that migration files are invalid module names
  "N999",
]
lint.per-file-ignores."feincms3_api/http.py" = [
  # django-ninja takes query parameters as function parameters
  "FBT001",
  "FBT002",
]
lint.per-file-ignores."feincms3_api/incubator/*" = [
  # The incubator isn't held to the package's complexity limits
  "N818",
  "PLR09",
]
lint.per-file-ignores."tests/*" = [
  # assertIs(value, True)
  "FBT003",
]
lint.per-file-ignores."tests/testapp/test_autotranslate.py" = [
  "PLR09",
]
lint.isort.combine-as-imports = true
lint.isort.lines-after-imports = 2
lint.mccabe.max-complexity = 15
lint.pylint.max-args = 8
lint.pylint.max-positional-args = 8
