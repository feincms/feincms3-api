[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling" ]

[project]
name = "feincms3-autotranslate"
description = "Machine-translate feincms3 content into another language and load it as inactive copies"
readme = "README.md"
license = "BSD-3-Clause"
authors = [
  { name = "Feinheit AG", email = "dev@feinheit.ch" },
]
requires-python = ">=3.11"
classifiers = [
  "Environment :: Web Environment",
  "Framework :: Django",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
]
dynamic = [ "version" ]
dependencies = [
  "django>=5.2",
  "django-content-editor>=7",
  "feincms3>=5",
  "feincms3-data>=0.11",
]
optional-dependencies.anthropic = [
  "anthropic>=0.70",
]
optional-dependencies.tests = [
  "coverage",
  "django-json-schema-editor",
  "django-prose-editor",
  "django-translated-fields",
  "feincms3-forms",
]
urls.Homepage = "https://github.com/feincms/feincms3-autotranslate/"

[tool.hatch]
version.path = "feincms3_autotranslate/__init__.py"
build.include = [ "feincms3_autotranslate/" ]
